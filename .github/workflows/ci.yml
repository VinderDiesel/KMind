name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Check DATA_CONTRACTS sync hint
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q 'packages/shared/src/schemas'; then
            git diff --name-only origin/main...HEAD | grep -q 'docs/DATA_CONTRACTS.md' || \
              echo "::warning::Schema changed; ensure docs/DATA_CONTRACTS.md is updated in the same PR"
          fi
